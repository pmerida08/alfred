<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Kanto Idle</title>
  <meta name="description" content="Juego incremental de Pokémon (fan game): captura, entrena y recorre Kanto, incluso sin conexión.">
  <meta name="theme-color" content="#0f1830">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kanto Idle">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="top">
      <div class="stat money" title="Pokédólares"><span class="coin">₽</span><b id="money">0</b></div>
      <div class="stat rates"><span id="dps">0</span> DPS<small id="clickdmg">0 / toque</small></div>
      <div class="stat candy" id="candyBox" hidden><img src="sprites/items/rare-candy.png" alt="Caramelos Raros"><b id="candies">0</b></div>
    </header>

    <main id="main">
      <section id="tab-battle" class="tab active">
        <div class="area-bar">
          <button id="areaPrev" class="icon-btn" aria-label="Zona anterior">‹</button>
          <div class="area-name">
            <b id="areaName">Ruta 1</b>
            <small id="areaSub"></small>
          </div>
          <button id="areaNext" class="icon-btn" aria-label="Zona siguiente">›</button>
        </div>
        <div class="area-prog"><i id="areaProgFill"></i><span id="areaProgText"></span></div>

        <div id="tip" class="tip" hidden>Toca al Pokémon para atacarlo. Con el dinero, contrata entrenadores en <b>Mejoras</b>: luchan por ti aunque no toques.</div>

        <div id="arena" class="arena" role="button" aria-label="Toca al Pokémon para atacarlo">
          <div id="bossLabel" class="boss-label" hidden></div>
          <div id="legendTag" class="legend-tag" hidden>Legendario</div>
          <div class="enemy-wrap" id="enemyWrap">
            <div class="shadow"></div>
            <img id="enemyImg" class="enemy-img" alt="" draggable="false">
            <div class="sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          </div>
          <div class="enemy-info">
            <div id="enemyName" class="enemy-name"></div>
            <div class="hp"><i id="hpFill"></i><span id="hpText"></span></div>
            <div id="gymTimer" class="gym-timer" hidden><i id="gymTimerFill"></i><span id="gymTimerText"></span></div>
          </div>
          <div id="floaters" class="floaters" aria-hidden="true"></div>
        </div>

        <div id="gymCta" class="card gym-cta" hidden></div>

        <div class="card">
          <div class="card-title">Poké Balls <small>coste por intento</small></div>
          <div id="balls" class="balls"></div>
          <div class="toggles">
            <label class="toggle"><input type="checkbox" id="optNext"><span>Auto-avanzar zona</span></label>
            <label class="toggle" id="optGymWrap"><input type="checkbox" id="optGym"><span>Auto-gimnasios</span></label>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Registro</div>
          <ul id="log" class="log"></ul>
        </div>
      </section>

      <section id="tab-team" class="tab">
        <div class="card" id="teamHead"></div>
        <div id="teamSlots" class="slots"></div>
        <div class="row-actions"><button id="btnAutoTeam" class="btn">Equipo óptimo</button></div>
        <div class="card-title pad">Caja <small id="boxCount"></small></div>
        <div id="box" class="box"></div>
      </section>

      <section id="tab-shop" class="tab">
        <div class="seg" id="shopSeg">
          <button data-sub="trainers" class="on">Entrenadores</button>
          <button data-sub="upgrades">Mejoras</button>
          <button data-sub="store">Tienda</button>
        </div>
        <div id="shop-trainers" class="sub on">
          <div class="mult" id="buyMult">
            <button data-m="1">x1</button><button data-m="10">x10</button><button data-m="100">x100</button><button data-m="max">Máx</button>
          </div>
          <div id="trainerList" class="list"></div>
        </div>
        <div id="shop-upgrades" class="sub"><div id="upgradeList" class="list"></div></div>
        <div id="shop-store" class="sub"><div id="storeList" class="list"></div></div>
      </section>

      <section id="tab-dex" class="tab">
        <div class="card" id="dexHead"></div>
        <div id="dexGrid" class="dex-grid"></div>
      </section>

      <section id="tab-more" class="tab">
        <div class="seg" id="moreSeg">
          <button data-sub="gyms" class="on">Gimnasios</button>
          <button data-sub="ach">Logros</button>
          <button data-sub="reset">Reinicio</button>
          <button data-sub="set">Ajustes</button>
        </div>
        <div id="more-gyms" class="sub on"></div>
        <div id="more-ach" class="sub"></div>
        <div id="more-reset" class="sub"></div>
        <div id="more-set" class="sub"></div>
      </section>
    </main>

    <nav id="tabs" aria-label="Secciones">
      <button data-tab="battle" class="on"><svg viewBox="0 0 24 24"><path d="M14.5 3 21 3.5 20.5 10 11 19.5 9.5 18 8 19.5 4.5 16 6 14.5 4.5 13 14.5 3zM5 19l-2 2"/></svg><span>Combate</span></button>
      <button data-tab="team"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9.5" r="2.5"/><path d="M3 20c0-3.6 2.7-6 6-6s6 2.4 6 6M15.5 14.3c3 0 5.5 2 5.5 5"/></svg><span>Equipo</span></button>
      <button data-tab="shop"><svg viewBox="0 0 24 24"><path d="M12 3v14M6 11l6-6 6 6M5 21h14"/></svg><span>Mejoras</span></button>
      <button data-tab="dex"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Pokédex</span></button>
      <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>Más</span></button>
    </nav>

    <div id="toasts" aria-live="polite"></div>
    <div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
  </div>
  <noscript>Kanto Idle necesita JavaScript para funcionar.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
